[project]
name = "django-unfold-markdown"
version = "0.2.1"
description = "Markdown editor widget for Django Unfold admin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Sergei Vasilev" }]
requires-python = ">=3.10,<4.0"
keywords = ["django", "unfold", "markdown", "admin", "easymde", "widget"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
]
dependencies = [
    "django>=4.2",
    # django-unfold dropped Python < 3.12 in 0.99. Keep older interpreters
    # installable instead of making the resolver fail outright on them.
    "django-unfold>=0.70.0; python_version < '3.12'",
    "django-unfold>=0.99.0; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/sergei-vasilev-dev/django-unfold-markdown"
Repository = "https://github.com/sergei-vasilev-dev/django-unfold-markdown"
Issues = "https://github.com/sergei-vasilev-dev/django-unfold-markdown/issues"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "pytest-cov>=7.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unfold_markdown"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/unfold_markdown",
    "/tests",
    "/README.md",
    "/LICENSE.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
fix = true
line-length = 88
target-version = "py310"
extend-exclude = ["src/unfold_markdown/static"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "DJ"]
ignore = ["E501", "B905", "C901"]
